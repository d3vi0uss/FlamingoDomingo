<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EliteDrop Ultimate</title>

<style>
:root{
--bg:#0f1115;
--card:#1a1d24;
--accent:#ff7a00;
--accent2:#ff9d2f;
--text:#ffffff;
--muted:#9aa3ad;
}

body{
margin:0;
font-family:Segoe UI,Arial;
background:linear-gradient(180deg,#0f1115,#0a0c10);
color:var(--text);
}

header{
background:#0c0e12;
padding:15px;
display:flex;
justify-content:space-between;
align-items:center;
border-bottom:1px solid #222;
box-shadow:0 0 20px rgba(0,0,0,.6);
}

.logo{
color:var(--accent);
font-weight:700;
font-size:20px;
}

.stats{color:var(--muted);}

nav{
display:flex;
flex-wrap:wrap;
gap:10px;
padding:12px;
justify-content:center;
background:#0c0e12;
border-bottom:1px solid #222;
}

nav button{
background:var(--card);
border:none;
color:white;
padding:10px 18px;
border-radius:30px;
cursor:pointer;
transition:.2s;
}

nav button:hover{
background:var(--accent);
}

.section{display:none;padding:20px;}
.active{display:block;}

/* CLICKER */
.coin-area{text-align:center;margin-top:40px;}
#coin{
width:180px;
cursor:pointer;
transition:.1s;
filter:drop-shadow(0 0 25px rgba(255,122,0,.6));
}
#coin:active{transform:scale(.9);}

.floating{
position:absolute;
color:var(--accent);
font-weight:bold;
pointer-events:none;
animation:floatUp 1s ease-out forwards;
}

@keyframes floatUp{
0%{opacity:1;transform:translateY(0);} 
100%{opacity:0;transform:translateY(-40px);} }

/* CARDS */
.inventory-grid{
display:grid;
grid-template-columns:repeat(auto-fill,minmax(180px,1fr));
gap:15px;
margin-top:20px;
}

.card{
background:var(--card);
border-radius:18px;
padding:12px;
box-shadow:0 0 15px rgba(0,0,0,.5);
transition:.2s;
}

.card:hover{transform:translateY(-4px);}

.card img{
width:100%;
border-radius:12px;
}

.price{color:var(--accent);font-weight:bold;}

button{
background:linear-gradient(145deg,var(--accent),var(--accent2));
border:none;
color:white;
padding:8px 14px;
border-radius:20px;
cursor:pointer;
margin-top:6px;
}

.market-listing{
background:#15181f;
padding:10px;
border-radius:14px;
margin-top:10px;
}

input{
padding:8px;
border-radius:10px;
border:none;
background:#0f1115;
color:white;
margin:5px;
}
</style>
</head>

<body>

<header>
<div class="logo">EliteDrop Ultimate</div>
<div class="stats">
💰 $<span id="money">0</span>
</div>
</header>

<nav>
<button onclick="show('clicker')">Click</button>
<button onclick="show('cases')">Cases</button>
<button onclick="show('inventory')">Inventory</button>
<button onclick="show('market')">Market</button>
<button onclick="show('trade')">Trading</button>
<button onclick="show('casino')">Casino</button>
</nav>

<!-- CLICKER -->
<div id="clicker" class="section active">
<div class="coin-area">
<img id="coin" src="https://i.imgur.com/7yUvePI.png" onclick="clickMoney(event)">
<h2>Click to earn money</h2>
</div>
</div>

<!-- CASES -->
<div id="cases" class="section">
<h2>Weapon Cases ($50)</h2>
<button onclick="openCase()">Open Case</button>
<div id="caseResult"></div>
</div>

<!-- INVENTORY -->
<div id="inventory" class="section">
<h2>Your Inventory</h2>
<div class="inventory-grid" id="inv"></div>
</div>

<!-- MARKET -->
<div id="market" class="section">
<h2>Marketplace</h2>
<div id="marketListings"></div>
</div>

<!-- TRADING -->
<div id="trade" class="section">
<h2>Trading</h2>
<p>Select an item to trade for random bot item.</p>
<div id="tradeInv"></div>
</div>

<!-- CASINO -->
<div id="casino" class="section">
<h2>Roulette</h2>
<input id="betAmount" placeholder="Bet Amount">
<button onclick="roulette('red')">Red</button>
<button onclick="roulette('black')">Black</button>
<div id="rouletteResult"></div>
</div>

<script>

let money=0;
let inventory=[];
let market=[];

const skins=[
{name:"AK‑47 | Neon Rider",price:120,img:"https://i.imgur.com/2DhmtJ4.png"},
{name:"M4A4 | Howl",price:900,img:"https://i.imgur.com/0Qd8KpG.png"},
{name:"AWP | Dragon Lore",price:1500,img:"https://i.imgur.com/6vQKQ7D.png"},
{name:"Karambit | Doppler",price:800,img:"https://i.imgur.com/6oKQK6K.png"},
{name:"Glock | Fade",price:300,img:"https://i.imgur.com/9g3K6hM.png"},
{name:"Deagle | Blaze",price:400,img:"https://i.imgur.com/IH7sXG6.png"},
{name:"Butterfly | Marble Fade",price:1200,img:"https://i.imgur.com/W2b7Q9H.png"}
];

function show(id){
document.querySelectorAll('.section').forEach(s=>s.classList.remove('active'));
document.getElementById(id).classList.add('active');
}

/* CLICK MONEY */
function clickMoney(e){
money+=1;
update();
let f=document.createElement('div');
f.className='floating';
f.innerText='+$1';
f.style.left=e.pageX+'px';
f.style.top=e.pageY+'px';
document.body.appendChild(f);
setTimeout(()=>f.remove(),1000);
}

/* CASE OPEN */
function openCase(){
if(money<50) return alert('Not enough money');
money-=50;
let skin=skins[Math.floor(Math.random()*skins.length)];
inventory.push(skin);
document.getElementById('caseResult').innerHTML=
`<div class='card'><img src='${skin.img}'><div>${skin.name}</div></div>`;
update();updateInventory();
}

/* INVENTORY */
function updateInventory(){
let div=document.getElementById('inv');
let trade=document.getElementById('tradeInv');
div.innerHTML='';trade.innerHTML='';

inventory.forEach((s,i)=>{

let card=`
<div class='card'>
<img src='${s.img}'>
<div>${s.name}</div>
<div class='price'>$${s.price}</div>
<button onclick='sell(${i})'>Sell</button>
<button onclick='listItem(${i})'>List</button>
<button onclick='tradeItem(${i})'>Trade</button>
</div>`;

div.innerHTML+=card;
trade.innerHTML+=card;
});
}

function sell(i){
money+=inventory[i].price;
inventory.splice(i,1);
updateInventory();update();
}

/* MARKET */
function listItem(i){
market.push(inventory[i]);
inventory.splice(i,1);
updateInventory();renderMarket();
}

function renderMarket(){
let div=document.getElementById('marketListings');
div.innerHTML='';

market.forEach((s,i)=>{
div.innerHTML+=`
<div class='market-listing'>
${s.name} — $${s.price}
<button onclick='buy(${i})'>Buy</button>
</div>`;
});

/* bot listings */
skins.slice(0,3).forEach(s=>{
div.innerHTML+=`
<div class='market-listing'>BOT: ${s.name} — $${s.price+50}</div>`;
});
}

function buy(i){
if(money<market[i].price) return;
money-=market[i].price;
inventory.push(market[i]);
market.splice(i,1);
updateInventory();renderMarket();update();
}

/* TRADING */
function tradeItem(i){
let bot=skins[Math.floor(Math.random()*skins.length)];
inventory[i]=bot;
updateInventory();
alert('Trade completed');
}

/* ROULETTE */
function roulette(color){
let bet=parseInt(document.getElementById('betAmount').value);
if(!bet||bet>money) return;

money-=bet;
let roll=Math.random()<.5?'red':'black';

if(roll===color) money+=bet*2;

document.getElementById('rouletteResult').innerText=
'Result: '+roll;

update();
}

function update(){
document.getElementById('money').innerText=Math.floor(money);
localStorage.setItem('eliteSave',JSON.stringify({money,inventory,market}));
}

function load(){
let s=JSON.parse(localStorage.getItem('eliteSave'));
if(!s) return;
money=s.money;inventory=s.inventory;market=s.market||[];
updateInventory();renderMarket();update();
}

load();
</script>
</body>
</html>
